<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevNet Quiz Reviewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0d1117;
    --panel:#131a24;
    --panel-2:#171f2c;
    --line:#25313f;
    --text:#dbe4ee;
    --dim:#7c8a9c;
    --accent:#39d98a;
    --accent-dim:#1f6b48;
    --bad:#ff6b6b;
    --bad-dim:#5c2626;
    --amber:#f0b64c;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, Segoe UI, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(57,217,138,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--accent-dim);}

  #sidebar{
    width:270px; flex:0 0 270px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:20px 16px 16px;
    display:flex; flex-direction:column; gap:14px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{font-family:var(--mono); font-size:12px; letter-spacing:.12em; color:var(--accent); text-transform:uppercase;}
  .brand-sub{font-size:18px; font-weight:600; line-height:1.25; margin-top:4px;}
  .prompt-line{font-family:var(--mono); font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center;}
  .prompt-line .caret{color:var(--accent); animation:blink 1.1s step-end infinite;}
  @keyframes blink{ 50%{opacity:0;} }

  #quizSelectWrap{display:flex; flex-direction:column; gap:4px;}
  #quizSelectWrap label{font-family:var(--mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em;}
  select#quizSelect{
    background:#0a0f16; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:9px 10px; font-family:var(--mono); font-size:13px;
  }

  #progressWrap{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:12px;}
  #progressBarOuter{height:6px; background:#0a0f16; border-radius:4px; overflow:hidden; margin-top:8px; border:1px solid var(--line);}
  #progressBarInner{height:100%; width:0%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); transition:width .25s ease;}

  #navGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; overflow-y:auto;}
  .navBtn{
    aspect-ratio:1/1; border:1px solid var(--line); background:var(--panel-2); color:var(--dim);
    font-family:var(--mono); font-size:12px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:all .15s ease;
  }
  .navBtn:hover{border-color:var(--accent); color:var(--text);}
  .navBtn.answered{background:rgba(57,217,138,0.1); color:var(--accent); border-color:var(--accent-dim);}
  .navBtn.current{outline:2px solid var(--accent); outline-offset:1px;}
  .navBtn.correct{background:rgba(57,217,138,0.18); color:var(--accent); border-color:var(--accent);}
  .navBtn.incorrect{background:rgba(255,107,107,0.15); color:var(--bad); border-color:var(--bad);}

  #finishBtn{
    margin-top:auto; background:var(--accent); color:#0a1510; border:none;
    font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.03em;
    padding:12px; border-radius:8px; cursor:pointer; text-transform:uppercase;
  }
  #finishBtn:hover{filter:brightness(1.08);}

  #main{flex:1; padding:36px 48px 80px; max-width:900px; margin:0 auto;}
  .qMeta{font-family:var(--mono); font-size:12px; color:var(--dim); display:flex; justify-content:space-between; margin-bottom:10px;}
  .qMeta .tag{color:var(--amber); border:1px solid var(--line); padding:2px 8px; border-radius:20px;}
  .qStem{font-size:17px; line-height:1.6; white-space:pre-wrap; margin-bottom:14px;}
  pre.code{
    background:#0a0f16; border:1px solid var(--line); border-left:3px solid var(--accent-dim);
    border-radius:6px; padding:16px 18px; font-family:var(--mono); font-size:13.5px;
    line-height:1.55; overflow-x:auto; color:#b9e6cd; margin:0 0 18px;
  }
  .hint{font-family:var(--mono); font-size:11.5px; color:var(--dim); margin:-6px 0 14px;}
  .flagNote{
    font-family:var(--mono); font-size:11.5px; color:var(--amber);
    background:rgba(240,182,76,0.08); border:1px solid rgba(240,182,76,0.3);
    border-radius:6px; padding:8px 10px; margin:-6px 0 14px;
  }

  .choiceList{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .choice{
    display:flex; gap:12px; align-items:flex-start; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice:hover{border-color:var(--accent-dim);}
  .choice input{margin-top:3px; accent-color:var(--accent);}
  .choice .txt{white-space:pre-wrap; font-size:14.5px; line-height:1.5;}
  .choice.selected{border-color:var(--accent); background:rgba(57,217,138,0.06);}
  .choice.showCorrect{border-color:var(--accent); background:rgba(57,217,138,0.14);}
  .choice.showWrong{border-color:var(--bad); background:rgba(255,107,107,0.1);}

  #feedbackBox{margin-top:16px; padding:12px 14px; border-radius:8px; font-family:var(--mono); font-size:13px; display:none;}
  #feedbackBox.ok{display:block; background:rgba(57,217,138,0.1); border:1px solid var(--accent-dim); color:var(--accent);}
  #feedbackBox.bad{display:block; background:rgba(255,107,107,0.08); border:1px solid var(--bad-dim); color:var(--bad);}

  .navRow{display:flex; justify-content:space-between; margin-top:28px; gap:12px;}
  .navRow button{
    font-family:var(--mono); font-size:13px; padding:11px 20px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .navRow button:hover{border-color:var(--accent);}
  .navRow button:disabled{opacity:.35; cursor:not-allowed;}

  #resultsScreen{display:none;}
  .scoreCard{
    text-align:center; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:48px 32px; margin-bottom:24px;
  }
  .scoreCard .big{font-family:var(--mono); font-size:64px; font-weight:700; color:var(--accent);}
  .scoreCard .sub{color:var(--dim); font-family:var(--mono); font-size:13px; margin-top:6px;}
  .resultsGrid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin-bottom:28px;}
  .rBox{
    aspect-ratio:1/1; border-radius:5px; font-family:var(--mono); font-size:11px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--line);
  }
  .rBox.correct{background:rgba(57,217,138,0.18); color:var(--accent); border-color:var(--accent);}
  .rBox.incorrect{background:rgba(255,107,107,0.15); color:var(--bad); border-color:var(--bad);}
  .actionsRow{display:flex; gap:12px; justify-content:center;}
  .actionsRow button{
    font-family:var(--mono); font-size:13px; padding:12px 22px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .actionsRow button.primary{background:var(--accent); color:#0a1510; border:none; font-weight:700;}

  @media(max-width:820px){
    body{flex-direction:column;}
    #sidebar{position:relative; width:100%; height:auto; flex:none;}
    #navGrid{max-height:180px;}
    #main{padding:24px 18px 60px;}
    .resultsGrid{grid-template-columns:repeat(6,1fr);}
  }
</style>
</head>
<body>

<div id="sidebar">
  <div>
    <div class="brand">// devnet_quiz.py</div>
    <div class="brand-sub" id="brandTitle">DevNet Associate Reviewer</div>
  </div>
  <div class="prompt-line"><span id="loadedCount">0</span> questions loaded<span class="caret">_</span></div>

  <div id="quizSelectWrap">
    <label for="quizSelect">Active Quiz</label>
    <select id="quizSelect"></select>
  </div>

  <div id="progressWrap">
    <div style="display:flex;justify-content:space-between;">
      <span>ANSWERED</span><span id="progressText">0 / 0</span>
    </div>
    <div id="progressBarOuter"><div id="progressBarInner"></div></div>
  </div>

  <div id="navGrid"></div>

  <button id="finishBtn">Grade Quiz ▸</button>
</div>

<div id="main">

  <div id="quizScreen">
    <div class="qMeta">
      <span id="qCounter">Question 1 / 10</span>
      <span class="tag" id="qTypeTag">SINGLE</span>
    </div>

    <div class="qStem" id="qStem"></div>
    <pre class="code" id="qCode" style="display:none;"></pre>
    <div id="qFlag" class="flagNote" style="display:none;"></div>
    <div id="qBody"></div>
    <div id="feedbackBox"></div>

    <div class="navRow">
      <button id="prevBtn">◂ Previous</button>
      <button id="nextBtn">Next ▸</button>
    </div>
  </div>

  <div id="resultsScreen">
    <div class="scoreCard">
      <div class="big" id="scoreBig">0%</div>
      <div class="sub" id="scoreSub">0 of 0 correct</div>
    </div>
    <div class="resultsGrid" id="resultsGrid"></div>
    <div class="actionsRow">
      <button class="primary" id="reviewWrongBtn">Review Missed Questions</button>
      <button id="retakeBtn">Retake Quiz</button>
    </div>
  </div>

</div>

<script>
/* =========================================================
   QUESTION DATA — multiple quizzes
========================================================= */
const QUIZZES = {

"1718951": {
  title: "Quiz 1718951 — DevNet Fundamentals",
  questions: [
{q:1,type:"single",stem:"What is the purpose of the Cisco DevNet Learning Labs?",
 opts:[["A","They provide a space for game development, interaction, and learning based on coding."],
       ["B","They allow participants to add their own Python labs."],
       ["C","They allow participants to add their own labs as long as the labs relate to any type of coding."],
       ["D","They provide self-paced tutorials including coding."]], ans:"D"},

{q:2,type:"single",stem:"What resources are available in the Cisco DevNet sandboxes?",
 opts:[["A","production-like development and code testing environments"],
       ["B","support for developer-related issues through the use of forums and live chats"],
       ["C","a repository of sample code written by developers"],
       ["D","self-paced tutorials that cover a wide range of automation and integration topics"]], ans:"A"},

{q:3,type:"multi",n:2,stem:"Which two DevNet resources are available online? (Choose two.)",
 opts:[["A","Code Exchange"],["B","API Tokens"],["C","Python Exchange"],
       ["D","Automation Exchange"],["E","DevNet Zone"]], ans:["A","D"]},

{q:4,type:"single",stem:"Which technology trend enables an industry shift towards automation, applications, and integrations?",
 opts:[["A","increased storage and RAM"],["B","increased internet connection bandwidth"],
       ["C","smaller and faster CPUs"],["D","advanced API capabilities"]], ans:"D"},

{q:5,type:"single",stem:"What is Cisco DevNet?",
 opts:[["A","a developer program"],["B","a way to create networks using software alone"],
       ["C","a Cisco-proprietary virtual network"],["D","a vendor-neutral type of virtual networking"]], ans:"A"},

{q:6,type:"single",stem:"What type of learner should take the DevNet Associate course?",
 opts:[["A","only new software developers"],["B","only new network engineers"],
       ["C","anyone interested in network automation and programmability"],
       ["D","anyone that does not like working in teams and is a software developer"]], ans:"C"},

{q:7,type:"single",stem:"What is required in order to ensure that clients are able to talk to applications that are outside a local system?",
 opts:[["A","a script"],["B","a network"],["C","an application"],["D","an API"]], ans:"B"},

{q:8,type:"multi",n:2,stem:"What are two requirements when participating in the DevNet Learning Labs? (Choose two.)",
 opts:[["A","The user must successfully log in with a DevNet account."],
       ["B","The user must have an active internet connection."],
       ["C","The user must have successfully passed the 200-901 DEVASC exam."],
       ["D","The user must have purchased the DevNet Learning Labs activation license."],
       ["E","The user must install a developer environment on a local computer."]], ans:["A","B"]},

{q:9,type:"single",stem:"What is the contracted response time after a developer opens a case-based ticket with the DevNet support service?",
 opts:[["A","one business day"],["B","one hour"],["C","one week"],["D","five business days"]], ans:"A"},

{q:10,type:"single",stem:"What is the purpose of Cisco DevNet?",
 opts:[["A","to teach everyone about the different Cisco API offerings and how to use them"],
       ["B","to be the central resource for everything about networking at Cisco"],
       ["C","to teach specific coding courses such as advanced Python and implementing REST APIs"],
       ["D","to be the central resource for advanced software developers and the use of Cisco APIs"]], ans:"A"}
  ]
},

"1719012": {
  title: "Quiz 1719012 — Linux & Python Basics",
  questions: [
{q:1,type:"single",stem:"What command is used to rename a file in a Linux system?",
 opts:[["A","cp"],["B","mv"],["C","rm"],["D","dd"]], ans:"B"},

{q:2,type:"single",stem:"Which Python command creates a conditional control structure?",
 opts:[["A","from"],["B","def"],["C","if"],["D","delay"]], ans:"C"},

{q:3,type:"single",stem:"A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command ifconfig -a. What is the result of this command?",
 opts:[["A","The ARP table of the computer will be displayed."],
       ["B","Both active and inactive interfaces will display information."],
       ["C","All active interfaces will display information."],
       ["D","The host routing table will be displayed."]], ans:"B"},

{q:4,type:"single",stem:"A user issues a series of Linux commands as shown. Which directory is the current directory after the cd command is entered?",
 code:'(omitted)$ pwd\n/home/devasc/labs/ansible/backups\n(omitted)$ cd ../..',
 opts:[["A","/home/devasc/labs"],["B","/home/devasc/labs/ansible"],
       ["C","/home"],["D","/home/devasc/"],["E","/"]], ans:"A"},

{q:5,type:"single",stem:"A student is learning Python in the interactive interpreter mode and issues the commands shown. What is the result of the final line?",
 code:">>> y=2\n>>> y*3\n6\n>>> 'Test'*y",
 opts:[["A","TypeError: A string type cannot be multiplied by an integer."],
       ["B","'Test6'"],["C","'Test2"],["D","'TestTest'"],
       ["E","'TestTestTestTestTestTest'"]], ans:"D"},

{q:6,type:"single",stem:"A system administrator issues the apt-get upgrade command on a Linux operating system. What is the purpose of this command?",
 opts:[["A","Operating system updates are downloaded and will be installed."],
       ["B","The remote repository of applications and dependencies will be updated to the latest version."],
       ["C","Every application installed will update itself to the latest version."],
       ["D","A specific application named upgrade will be installed."]], ans:"B",
 flag:"Source material marked option A with an ✗ (flagged as incorrect) without clearly indicating the intended correct answer. Option B is used here as the best fit, but double-check this one against your course notes."},

{q:7,type:"single",stem:'A student new to Python issues the command: ipAddress = {"R1":"10.1.1.1","R2":"10.2.2.1","R3":"10.3.3.1"}. Which data type is used to represent the variable ipAddress?',
 opts:[["A","dictionary"],["B","tuple"],["C","array"],["D","list"]], ans:"A"},

{q:8,type:"single",stem:"A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command ifconfig -a. What is the result of this command?",
 opts:[["A","The host routing table will be displayed."],
       ["B","The ARP table of the computer will be displayed."],
       ["C","Both active and inactive interfaces will display information."],
       ["D","All active interfaces will display information."]], ans:"C"},

{q:9,type:"single",stem:"A system administrator of a Linux server is searching the passwd file for the username taylor that appears at the beginning of the line. Which grep command should the administrator use?",
 opts:[["A","grep '[taylor]' /etc/passwd"],["B","grep '^taylor' /etc/passwd"],
       ["C","grep '.taylor' /etc/passwd"],["D","grep taylor /etc/passwd"]], ans:"B"},

{q:10,type:"single",stem:"A student is reviewing the Python script shown. Under which condition will the elif statement be evaluated?",
 code:'aclNum = int(input("What is the IPv4 ACL number? "))\nif aclNum >= 1 and aclNum <= 99:\n    print("This is a standard IPv4 ACL.")\nelif aclNum >= 100 and aclNum <= 199:\n    print("This is an extended IPv4 ACL.")\nelse:\n    print("This is not a standard or extended IPv4 ACL.")',
 opts:[["A","when the input is a string"],["B","when the first print statement fails"],
       ["C","when the input is a float number"],["D","when the if statement is false"]], ans:"D"},

{q:11,type:"single",stem:"A student new to Python issues the commands shown. What is the result?",
 code:'>>> devicenames=["RT1", "RT2", "SW1", "SW2"]\n>>> hostnames=devicenames + ["RT3", "SW3"]\n>>> del hostnames[3]\n>>> hostnames',
 opts:[["A","['RT1', 'RT2', 'SW1', 'RT3', 'SW3']"],
       ["B","['RT1', 'RT2', 'SW1', 'SW2', 'SW3']"],
       ["C","['RT1', 'RT2', 'SW2', 'RT3', 'SW3']"],
       ["D","['RT1', 'RT2', 'RT3', 'SW2', 'SW3']"]], ans:"A"},

{q:12,type:"single",stem:"A developer needs to check the version of the running Python package. Which command should the developer use?",
 opts:[["A","python3 –v"],["B","python3 -V"],["C","python3 -i"],["D","python3 -q"]], ans:"B"},

{q:13,type:"single",stem:"A user enters the commands shown. What is the result after the mv command is entered?",
 code:'devasc@labvm:~/Documents$ pwd\n/home/devasc/Documents\ndevasc@labvm:~/Documents$ mv myfile.sh ../Desktop/myfile2.sh',
 opts:[["A","The file myfile.sh is copied and renamed to myfile2.sh in the current directory."],
       ["B","The file myfile.sh is copied to the /home/devasc/Desktop directory and replaces the file myfile2.sh."],
       ["C","The file myfile.sh is copied to the /home/devasc/Desktop directory and renamed as myfile2.sh."],
       ["D","The file myfile.sh is moved to the /home/devasc/Desktop directory and renamed as myfile2.sh."]], ans:"D"},

{q:14,type:"multi",n:2,stem:"A user issues the Linux command ls -l myfile.sh to check the permission of the file. Which two statements describe the permissions assigned to the file?",
 code:'devasc@labvm:~/Documents$ ls -l myfile.sh\n-rwxr-xr-- 1 self test 15 Mar 30 21:24 myfile.sh',
 opts:[["A","The user with the user ID of devasc can modify the file."],
       ["B","All users can execute the file."],
       ["C","The user with the user ID of self can modify the file."],
       ["D","Any user in the self group can read, modify, and execute the file."],
       ["E","Any user in the test group can execute the file."]], ans:["C","E"]},

{q:15,type:"single",stem:"What Linux command is used to display the contents of the current directory?",
 opts:[["A","pwd"],["B","cat"],["C","ls"],["D","ln"]], ans:"C"},

{q:16,type:"single",stem:'A user issues the apt-get upgrade command to update system files in a Ubuntu Linux system and receives an error message of "permission denied." What should the user do to complete the task?',
 opts:[["A","Issue the sudo apt-get upgrade command."],
       ["B","Issue the apt-get install –allow command."],
       ["C","Issue the sudo apt-get install command."],
       ["D","Issue the allow apt-get upgrade command."]], ans:"A"},

{q:17,type:"single",stem:"What is the output when the following code is entered into a Python program interpreter?",
 code:"[1,2,4,5] + [3,6]",
 opts:[["A","[12]+[9]"],["B","[21]"],["C","[1,2,4,5,3,6]"],["D","[1,2,3,4,5,6]"]], ans:"C"}
  ]
}

};

/* =========================================================
   APP LOGIC
========================================================= */
let activeQuizId = Object.keys(QUIZZES)[0];
let Q = QUIZZES[activeQuizId].questions;
let TOTAL = Q.length;
let current = 0;
let answers = {};
let graded = false;
let gradeResults = {};

const navGrid = document.getElementById('navGrid');
const progressText = document.getElementById('progressText');
const progressBarInner = document.getElementById('progressBarInner');
const quizSelect = document.getElementById('quizSelect');
const brandTitle = document.getElementById('brandTitle');
const loadedCount = document.getElementById('loadedCount');

function populateQuizSelect(){
  quizSelect.innerHTML = '';
  Object.keys(QUIZZES).forEach(id=>{
    const o = document.createElement('option');
    o.value = id; o.textContent = QUIZZES[id].title;
    quizSelect.appendChild(o);
  });
  quizSelect.value = activeQuizId;
}
populateQuizSelect();

quizSelect.onchange = ()=>{
  loadQuiz(quizSelect.value);
};

function loadQuiz(id){
  activeQuizId = id;
  Q = QUIZZES[id].questions;
  TOTAL = Q.length;
  current = 0;
  answers = {};
  graded = false;
  gradeResults = {};
  brandTitle.textContent = QUIZZES[id].title;
  loadedCount.textContent = TOTAL;
  document.getElementById('resultsScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  document.getElementById('sidebar').style.display='flex';
  buildNav();
  render();
}

function buildNav(){
  navGrid.innerHTML = '';
  Q.forEach((qq,i)=>{
    const b = document.createElement('div');
    b.className = 'navBtn';
    b.textContent = qq.q;
    b.onclick = ()=>{ current = i; render(); };
    navGrid.appendChild(b);
  });
}

function isAnswered(q){
  const a = answers[q.q];
  if(a===undefined) return false;
  if(q.type==='single') return !!a;
  if(q.type==='multi') return a && a.length>0;
  return false;
}

function updateProgress(){
  const answeredCount = Q.filter(isAnswered).length;
  progressText.textContent = answeredCount + ' / ' + TOTAL;
  progressBarInner.style.width = (answeredCount/TOTAL*100) + '%';
  const btns = navGrid.children;
  Q.forEach((qq,i)=>{
    btns[i].classList.toggle('answered', isAnswered(qq));
    btns[i].classList.toggle('current', i===current);
  });
}

function typeLabel(t){
  return {single:'SINGLE CHOICE', multi:'MULTI SELECT'}[t];
}

function render(){
  const q = Q[current];
  document.getElementById('qCounter').textContent = 'Question ' + q.q + ' / ' + TOTAL;
  document.getElementById('qTypeTag').textContent = typeLabel(q.type);
  document.getElementById('qStem').textContent = q.stem;

  const codeEl = document.getElementById('qCode');
  if(q.code){ codeEl.style.display='block'; codeEl.textContent = q.code; }
  else{ codeEl.style.display='none'; }

  const flagEl = document.getElementById('qFlag');
  if(q.flag){ flagEl.style.display='block'; flagEl.textContent = '⚠ ' + q.flag; }
  else{ flagEl.style.display='none'; }

  const body = document.getElementById('qBody');
  body.innerHTML='';

  if(q.type==='single'){
    const wrap = document.createElement('div'); wrap.className='choiceList';
    q.opts.forEach(([k,v])=>{
      const div = document.createElement('label'); div.className='choice';
      div.innerHTML = '<input type="radio" name="single'+q.q+'"><span class="txt"></span>';
      div.querySelector('.txt').textContent = v;
      const input = div.querySelector('input');
      input.checked = answers[q.q]===k;
      if(answers[q.q]===k) div.classList.add('selected');
      input.onchange = ()=>{ answers[q.q]=k; updateProgress(); render(); };
      wrap.appendChild(div);
    });
    body.appendChild(wrap);
    if(graded) applySingleFeedback(q, wrap);
  }

  if(q.type==='multi'){
    const hint = document.createElement('div'); hint.className='hint';
    hint.textContent = 'Select exactly '+q.n+' choice(s).';
    body.appendChild(hint);
    const wrap = document.createElement('div'); wrap.className='choiceList';
    if(!answers[q.q]) answers[q.q]=[];
    q.opts.forEach(([k,v])=>{
      const div = document.createElement('label'); div.className='choice';
      div.innerHTML = '<input type="checkbox"><span class="txt"></span>';
      div.querySelector('.txt').textContent = v;
      const input = div.querySelector('input');
      input.checked = answers[q.q].includes(k);
      if(input.checked) div.classList.add('selected');
      input.onchange = ()=>{
        let arr = answers[q.q];
        if(input.checked){ arr.push(k); } else { arr = arr.filter(x=>x!==k); }
        answers[q.q]=arr;
        updateProgress(); render();
      };
      wrap.appendChild(div);
    });
    body.appendChild(wrap);
    if(graded) applyMultiFeedback(q, wrap);
  }

  const fb = document.getElementById('feedbackBox');
  fb.className=''; fb.innerHTML='';
  if(graded){
    const correct = gradeResults[q.q];
    fb.className = correct ? 'ok':'bad';
    fb.textContent = correct ? '✔ Correct.' : '✘ Not quite — the correct answer is highlighted above.';
  }

  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===TOTAL-1 ? 'Finish ▸' : 'Next ▸';
  updateProgress();
}

function applySingleFeedback(q, wrap){
  const labels = wrap.querySelectorAll('.choice');
  labels.forEach((div,i)=>{
    const k = q.opts[i][0];
    div.querySelector('input').disabled = true;
    if(k===q.ans) div.classList.add('showCorrect');
    else if(answers[q.q]===k) div.classList.add('showWrong');
  });
}
function applyMultiFeedback(q, wrap){
  const labels = wrap.querySelectorAll('.choice');
  labels.forEach((div,i)=>{
    const k = q.opts[i][0];
    div.querySelector('input').disabled = true;
    const chosen = answers[q.q].includes(k);
    if(q.ans.includes(k)) div.classList.add('showCorrect');
    else if(chosen) div.classList.add('showWrong');
  });
}

document.getElementById('prevBtn').onclick = ()=>{ if(current>0){ current--; render(); } };
document.getElementById('nextBtn').onclick = ()=>{
  if(current<TOTAL-1){ current++; render(); }
  else { gradeQuiz(); }
};
document.getElementById('finishBtn').onclick = gradeQuiz;

function gradeQuestion(q){
  const a = answers[q.q];
  if(q.type==='single') return a===q.ans;
  if(q.type==='multi'){
    if(!a || a.length!==q.ans.length) return false;
    const s1=[...a].sort().join(','); const s2=[...q.ans].sort().join(',');
    return s1===s2;
  }
  return false;
}

function gradeQuiz(){
  graded = true;
  let correctCount = 0;
  Q.forEach(q=>{
    const ok = gradeQuestion(q);
    gradeResults[q.q]=ok;
    if(ok) correctCount++;
  });
  showResults(correctCount);
}

function showResults(correctCount){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultsScreen').style.display='block';
  document.getElementById('sidebar').style.display='none';
  const pct = Math.round(correctCount/TOTAL*100);
  document.getElementById('scoreBig').textContent = pct+'%';
  document.getElementById('scoreSub').textContent = correctCount+' of '+TOTAL+' correct';
  const grid = document.getElementById('resultsGrid');
  grid.innerHTML='';
  Q.forEach(q=>{
    const box = document.createElement('div');
    box.className = 'rBox ' + (gradeResults[q.q] ? 'correct':'incorrect');
    box.textContent = q.q;
    box.onclick = ()=>{ jumpToReview(q.q-1); };
    grid.appendChild(box);
  });
}

function jumpToReview(idx){
  document.getElementById('resultsScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  document.getElementById('sidebar').style.display='flex';
  current = idx;
  render();
}

document.getElementById('reviewWrongBtn').onclick = ()=>{
  const firstWrong = Q.findIndex(q=>!gradeResults[q.q]);
  jumpToReview(firstWrong===-1?0:firstWrong);
};
document.getElementById('retakeBtn').onclick = ()=>{
  answers = {}; graded=false; gradeResults={}; current=0;
  document.getElementById('resultsScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  document.getElementById('sidebar').style.display='flex';
  render();
};

loadQuiz(activeQuizId);
</script>
</body>
</html>
